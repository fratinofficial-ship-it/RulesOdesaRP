<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050806">
    <title>Chernihiw RP — залетайте</title>
    <style>
        @font-face {
            font-family: "Unbounded";
            src: url("LogoSCUnboundedSans-Regular.ttf") format("truetype");
            font-weight: 400;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --green: #67ff9a;
            --bright-green: #b1ffc8;
            --muted-green: #8eb89b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            padding: 32px 18px;
            background:
                radial-gradient(ellipse at 50% 45%, rgba(32, 132, 67, .17), transparent 48%),
                radial-gradient(circle, rgba(160, 255, 190, .17) .7px, transparent .9px) 0 0 / 13px 13px,
                #050806;
            color: #f0fff4;
            font-family: "Unbounded", "Arial", sans-serif;
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            content: "";
            pointer-events: none;
        }

        body::before {
            inset: 0;
            background:
                linear-gradient(90deg, transparent 49.9%, rgba(103, 255, 154, .035) 50%, transparent 50.1%),
                linear-gradient(0deg, transparent 49.9%, rgba(103, 255, 154, .025) 50%, transparent 50.1%);
            background-size: 58px 58px;
            mask-image: radial-gradient(ellipse at center, #000 10%, transparent 78%);
        }

        body::after {
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, .68) 100%);
        }

        .banner {
            position: relative;
            width: min(100%, 760px);
            padding: clamp(32px, 7vw, 72px) clamp(22px, 7vw, 68px);
            overflow: hidden;
            border: 1px solid rgba(103, 255, 154, .32);
            border-radius: 24px;
            background:
                linear-gradient(145deg, rgba(14, 30, 19, .94), rgba(5, 11, 7, .97) 62%),
                #080d09;
            box-shadow:
                0 0 0 1px rgba(103, 255, 154, .06) inset,
                0 0 45px rgba(40, 255, 112, .11),
                0 28px 90px rgba(0, 0, 0, .58);
            text-align: center;
        }

        .banner::before {
            position: absolute;
            inset: 0 16% auto;
            height: 1px;
            content: "";
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            box-shadow: 0 0 20px rgba(103, 255, 154, .8);
        }

        .eyebrow {
            margin: 0 0 28px;
            color: var(--green);
            font: 700 11px/1.5 Arial, sans-serif;
            letter-spacing: .34em;
            text-transform: uppercase;
            text-shadow: 0 0 14px rgba(103, 255, 154, .6);
        }

        h1 {
            margin: 0;
            color: var(--bright-green);
            font-size: clamp(29px, 7vw, 62px);
            font-weight: 400;
            line-height: 1.18;
            letter-spacing: -.055em;
            text-shadow:
                0 0 12px rgba(103, 255, 154, .56),
                0 0 38px rgba(45, 255, 109, .26);
        }

        .invite {
            margin: 22px 0 0;
            color: #d7e9dc;
            font: 700 clamp(12px, 2.4vw, 16px)/1.5 Arial, sans-serif;
            letter-spacing: .28em;
        }

        .server-name {
            margin: 9px 0 0;
            color: var(--green);
            font-size: clamp(25px, 6.4vw, 51px);
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: .04em;
            overflow-wrap: anywhere;
            text-shadow:
                0 0 10px rgba(103, 255, 154, .66),
                0 0 32px rgba(45, 255, 109, .42);
        }

        .server-subtitle {
            margin: 8px 0 0;
            color: var(--muted-green);
            font: 500 12px/1.5 Arial, sans-serif;
            letter-spacing: .3em;
        }

        .join-button {
            display: inline-flex;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 36px;
            padding: 0 30px;
            border: 1px solid var(--green);
            border-radius: 8px;
            background: var(--green);
            box-shadow: 0 0 22px rgba(67, 255, 128, .28);
            color: #07120a;
            font: 800 13px/1 Arial, sans-serif;
            letter-spacing: .15em;
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .join-button:hover {
            transform: translateY(-2px);
            background: #9dffb8;
            box-shadow: 0 0 34px rgba(67, 255, 128, .48);
        }

        .join-button:focus-visible,
        .copy-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }

        .join-arrow {
            font-size: 18px;
            line-height: 1;
        }

        .code-block {
            margin: 34px auto 0;
            padding-top: 24px;
            border-top: 1px solid rgba(103, 255, 154, .17);
        }

        .code-label {
            margin: 0 0 13px;
            color: var(--muted-green);
            font: 700 10px/1.5 Arial, sans-serif;
            letter-spacing: .22em;
            text-transform: uppercase;
        }

        .code-row {
            display: flex;
            width: min(100%, 390px);
            min-height: 54px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 auto;
            padding: 7px 8px 7px 19px;
            border: 1px solid rgba(103, 255, 154, .24);
            border-radius: 9px;
            background: rgba(0, 0, 0, .35);
            color: inherit;
            cursor: pointer;
            font: inherit;
            text-align: left;
            transition: border-color .2s ease, background .2s ease;
        }

        .code-row:hover {
            border-color: rgba(103, 255, 154, .6);
            background: rgba(103, 255, 154, .05);
        }

        .server-code {
            color: var(--bright-green);
            font: 700 17px/1.2 "Consolas", "Courier New", monospace;
            letter-spacing: .12em;
            text-shadow: 0 0 12px rgba(103, 255, 154, .42);
        }

        .copy-button {
            display: inline-flex;
            min-height: 38px;
            align-items: center;
            justify-content: center;
            padding: 0 13px;
            border: 1px solid rgba(103, 255, 154, .43);
            border-radius: 6px;
            background: rgba(103, 255, 154, .09);
            color: var(--bright-green);
            font: 700 10px/1 Arial, sans-serif;
            letter-spacing: .08em;
            transition: background .2s ease, border-color .2s ease;
        }

        .code-row:hover .copy-button {
            border-color: var(--green);
            background: rgba(103, 255, 154, .18);
        }

        .copy-status {
            min-height: 18px;
            margin: 10px 0 0;
            color: var(--green);
            font: 12px/1.5 Arial, sans-serif;
        }

        @media (max-width: 480px) {
            .banner {
                border-radius: 18px;
            }

            .eyebrow {
                margin-bottom: 22px;
                letter-spacing: .2em;
            }

            .join-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="banner">
        <p class="eyebrow">Чернигов приглашает</p>
        <h1>ОНУКС ОКУНЬ<br>ЕБУЧИЙ</h1>
        <p class="invite">ЗАЛЕТАЙТЕ НА</p>
        <p class="server-name">CHERNIHIWRP</p>
        <p class="server-subtitle">ЧЕРНИГОВ RP</p>

        <a
            class="join-button"
            href="https://t.me/ChernihiwRP"
            target="_blank"
            rel="noopener noreferrer"
        >
            ЗАЙТИ В ГРУППУ <span class="join-arrow" aria-hidden="true">↗</span>
        </a>

        <section class="code-block" aria-labelledby="code-label">
            <h2 class="code-label" id="code-label">Код Чернигова</h2>
            <button class="code-row" id="copy-code" type="button" aria-label="Скопировать код Чернигова">
                <code class="server-code" id="server-code">3vs3sqqq</code>
                <span class="copy-button" aria-hidden="true">КОПИРОВАТЬ</span>
            </button>
            <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script>
        const copyButton = document.getElementById("copy-code");
        const code = document.getElementById("server-code").textContent;
        const status = document.getElementById("copy-status");

        copyButton.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(code);
                status.textContent = "Код скопирован";
            } catch {
                const temporaryInput = document.createElement("textarea");
                temporaryInput.value = code;
                temporaryInput.setAttribute("readonly", "");
                temporaryInput.style.position = "fixed";
                temporaryInput.style.opacity = "0";
                document.body.appendChild(temporaryInput);
                temporaryInput.select();

                const copied = document.execCommand("copy");
                temporaryInput.remove();
                status.textContent = copied
                    ? "Код скопирован"
                    : "Не удалось скопировать — выделите код вручную";
            }
        });
    </script>
</body>
</html>
